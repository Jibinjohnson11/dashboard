# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → pick this repo. You'll be asked for DATABASE_URL (Neon) and MONGODB_URI (from MongoDB Atlas).
services:
  - type: web
    name: dashboard
    runtime: docker
    plan: free
    # Same region as Neon (Singapore); closest Render region to MongoDB Atlas (Mumbai). Can't be changed later.
    region: singapore
    healthCheckPath: /healthz/
    # Free instances have no pre-deploy step, so run the Procfile release commands on start.
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py init_mongodb &&
      gunicorn config.wsgi:application -c gunicorn.conf.py"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_TRUST_X_FORWARDED_FOR
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Neon production branch: paste DATABASE_URL (pooled) and DATABASE_URL_UNPOOLED (direct, for migrations)
      # from `neon env pull` when Render asks.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: seo_dashboard
      - key: REGISTRATION_MODE
        value: invite_only
      - key: CACHE_BACKEND
        value: db
      - key: PORT
        value: "8000"
      # The free plan has 512 MB of memory; keep gunicorn small.
      - key: GUNICORN_WORKERS
        value: "2"
      # Email via Brevo SMTP. Free instances block ports 25/465/587, so use 2525 with STARTTLS.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "15"
      # Brevo SMTP login, SMTP key and verified sender: entered in the Render dashboard, never committed.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
