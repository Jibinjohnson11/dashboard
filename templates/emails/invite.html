<!doctype html>
<html><body style="margin:0;padding:24px;background:#f8fafc;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px">
    <tr><td style="padding:28px">
      <h1 style="font-size:20px;margin:0 0 12px">You're invited</h1>
      <p style="color:#334155;line-height:1.6">Hello {{ user.full_name }}, {{ inviter_name }} has invited you to the SEO Management Dashboard.</p>
      <p style="margin:24px 0"><a href="{{ invite_url }}" style="background:#1e3a8a;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Set up your account</a></p>
      <p style="color:#64748b;font-size:13px;line-height:1.6">This link expires in {{ valid_hours }} hours and can be used once. If you weren't expecting this invitation, ignore this email.</p>
    </td></tr>
  </table>
</body></html>
